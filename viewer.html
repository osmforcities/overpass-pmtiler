<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>pmtiler viewer</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
<style>
  html, body, #map { margin:0; height:100%; }
  #hud { position:fixed; top:8px; left:8px; z-index:10; background:#fff;
         font:12px/1.5 monospace; padding:8px 10px; border:1px solid #ccc;
         max-width:32em; max-height:90vh; overflow:auto; }
  #hud a { display:block; color:#06c; }
  #hud a.back { margin-bottom:.5em; }
  #hud b { display:block; margin:.6em 0 .3em; }
  #hud input, #hud textarea, #hud button { font:inherit; width:100%;
    box-sizing:border-box; margin-bottom:.3em; }
  #hud label { display:flex; gap:.4em; align-items:center; }
  #formerr { color:#c00; }
  .stage { color:#999; }
  .stage.on { color:#000; font-weight:bold; }
  .stage.done { color:#555; }
  .stage.done progress { opacity:.45; }
  .stage progress { display:block; width:100%; height:.6em; margin:.2em 0 .4em; }
  button.city { text-align:left; }
  .band { display:inline-block; width:1.2em; height:.8em; margin-right:.3em; }
</style>
</head>
<body>
<div id="map"></div>
<div id="hud">loading…</div>
<script>
// Render harness for a baked job, derived from spike/tile-harness.html.
// Served by pmtiler itself so the archive is same-origin (range requests).
// Deliberately one dependency-free HTML file with two CDN scripts, not a
// bundled app: no build step before serving, nothing to rebuild on deploy.
// Reach for a bundler only if this grows past a couple of views or must
// serve its assets locally.
const hud = document.getElementById("hud");
const jobId = new URLSearchParams(location.search).get("job");

// recency band colors (viridis), cutoffs matching stats recencyBandsDays
const BANDS = [["#414487", "<= 90d"], ["#2a788e", "90d-1y"],
               ["#22a884", "1-2y"], ["#7ad151", "> 2y"]];
const d = 86400;
const now = Math.floor(Date.now() / 1000);
const ageColor = ["step", ["-", now, ["get", "_ts"]],
  BANDS[0][0], 90 * d, BANDS[1][0], 365 * d, BANDS[2][0], 730 * d, BANDS[3][0]];

// A running stage reports what it can: bytes (fetch gets no Content-Length from
// Overpass), features so far, or a true percentage from tippecanoe.
const BACK = '<a class="back" href="/">&larr; all jobs</a>';
const STAGES = ["queued", "fetching", "converting", "baking"];

function progressText(p) {
  if (!p) return "";
  if (p.pct !== undefined) return ` ${p.pct.toFixed(1)}%`;
  if (p.bytes !== undefined) return ` ${(p.bytes / 1048576).toFixed(0)} MB`;
  if (p.features !== undefined) return ` ${p.features.toLocaleString()} features`;
  return "";
}

// Skeleton is rendered once so the form keeps focus and typed text while the
// job list refreshes underneath it.
const INDEX_HTML = `
  <b>pmtiler jobs</b>
  <div id="list">loading…</div>
  <b>canonical cities</b>
  <div id="cities"></div>
  <form id="new">
    <b>custom job</b>
    <input id="jid" placeholder="job id" required
           pattern="[A-Za-z0-9._-]{1,128}">
    <textarea id="query" rows="4" required></textarea>
    <label>timeout <input id="timeout" type="number" value="300"></label>
    <label>maxsize <input id="maxsize" type="number" value="805306368"></label>
    <button>submit</button>
    <span id="formerr"></span>
  </form>`;

// Canonical test set. The first three are measured end to end; SP state is the
// next size up; Tokyo is the ceiling case and is expected to fail -- keep it in
// the list, refusing it gracefully is a requirement, not an accident.
const CITIES = [
  {id: "delft-buildings", label: "Delft (39.6k) ~25s",
   rel: 324269, maxsize: 536870912, timeout: 300},
  {id: "ams-buildings", label: "Amsterdam (197k) ~1min",
   rel: 271110, maxsize: 805306368, timeout: 300},
  {id: "sp-buildings", label: "Sao Paulo city (2.14M) ~10min",
   rel: 298285, maxsize: 805306368, timeout: 900},
  {id: "sp-state-buildings", label: "Sao Paulo state (2.71M)",
   rel: 298204, maxsize: 1073741824, timeout: 1800},
  {id: "tokyo-buildings", label: "Tokyo Metropolis (>3GiB, expected to fail)",
   rel: 1543125, maxsize: 1073741824, timeout: 1800},
];

const query = (rel) =>
  `[out:json];area(${3600000000 + rel})->.a;way["building"](area.a);out geom meta;`;

const EXAMPLE = query(CITIES[0].rel);

async function submit(body) {
  const res = await fetch("/jobs", {method: "POST", body: JSON.stringify(body)});
  const out = await res.json();
  if (!res.ok) {
    document.getElementById("formerr").textContent = `${body.id}: ${out.error}`;
    return;
  }
  location.search = "?job=" + encodeURIComponent(body.id);  // 202 new, 200 existing
}

async function refreshList() {
  const jobs = await (await fetch("/jobs")).json();
  document.getElementById("list").innerHTML = jobs.length
    ? jobs.map(j =>
        `<a href="?job=${encodeURIComponent(j.id)}">${j.id} — ${j.state}` +
        `${progressText(j.progress)}</a>`).join("")
    : "<i>none yet</i>";
  setTimeout(refreshList, 2000);
}

async function index() {
  hud.innerHTML = INDEX_HTML;
  document.getElementById("query").value = EXAMPLE;

  const cities = document.getElementById("cities");
  cities.innerHTML = CITIES.map((c, i) =>
    `<button class="city" data-i="${i}">${c.label}</button>`).join("");
  cities.onclick = (ev) => {
    const b = ev.target.closest("button.city");
    if (!b) return;
    const c = CITIES[b.dataset.i];
    // POST is idempotent, so clicking one that already ran just opens it
    submit({id: c.id, query: query(c.rel), timeout: c.timeout, maxsize: c.maxsize});
  };

  document.getElementById("new").onsubmit = (ev) => {
    ev.preventDefault();
    submit({
      id: document.getElementById("jid").value.trim(),
      query: document.getElementById("query").value,
      timeout: +document.getElementById("timeout").value || undefined,
      maxsize: +document.getElementById("maxsize").value || undefined,
    });
  };
  refreshList();
}

async function show() {
  let job;
  for (;;) {
    job = await (await fetch("/jobs/" + encodeURIComponent(jobId))).json();
    if (job.error && !job.state) { hud.textContent = job.error; return; }
    if (job.state === "done" || job.state === "failed") break;
    // A stage the job has moved past is complete, whatever its last sample said:
    // progress is throttled to 1/s so the final in-stage reading is always stale,
    // and convert's last tick lands before the trailing input is consumed. Trust
    // the state machine for completion, the percentage only for the live stage.
    const cur = STAGES.indexOf(job.state);
    const pct = job.progress && job.progress.pct;
    hud.innerHTML = `${BACK}<b>${jobId}</b>` + STAGES.map((s, i) => {
      if (i > cur) return `<div class="stage">${s}</div>`;
      if (i < cur) return `<div class="stage done">${s}` +
        `<progress value="100" max="100"></progress></div>`;
      // fetch has no denominator (Overpass answers chunked), so its bar stays
      // indeterminate rather than showing a made-up percentage
      const bar = pct !== undefined && pct !== null
        ? `<progress value="${pct}" max="100"></progress>` : `<progress></progress>`;
      return `<div class="stage on">${s}${progressText(job.progress)}${bar}</div>`;
    }).join("");
    await new Promise(r => setTimeout(r, 2000));
  }
  if (job.state === "failed") {
    // error text as a text node, never HTML: a tippecanoe error tail can
    // quote OSM tag values, which anyone can author
    hud.innerHTML = `${BACK}<b>${jobId} failed</b><br>`;
    hud.appendChild(document.createTextNode(job.error));
    return;
  }
  const s = job.stats;
  hud.innerHTML = `${BACK}<b>${jobId}</b><br>` + [
    `${s.features.toLocaleString()} features ` +
      `(${s.ways.toLocaleString()} ways, ${s.nodes.toLocaleString()} nodes` +
      (s.relationsSkipped ? `, ${s.relationsSkipped.toLocaleString()} relations skipped` : "") + ")",
    `${s.editorsCount} editors, ${s.changesetsCount} changesets`,
    `avg age ${s.averageElementAge}d, avg version ${s.averageElementVersion}`,
    BANDS.map(([c, label], i) =>
      `<span class="band" style="background:${c}"></span>${label}: ` +
      s.editRecencyBands[i].toLocaleString()).join("<br>"),
    `<a href="/jobs/${jobId}/output.pmtiles">output.pmtiles</a>`,
    `<a href="/jobs/${jobId}/stats.json">stats.json</a>`,
    `<a href="/jobs/${jobId}/data.ndjson">data.ndjson</a>`,
    `<a href="#" id="del">delete job</a>`,
  ].join("<br>");
  document.getElementById("del").onclick = async (ev) => {
    ev.preventDefault();
    if (!confirm(`Delete ${jobId} and its outputs?`)) return;
    await fetch("/jobs/" + encodeURIComponent(jobId), {method: "DELETE"});
    location.href = "/";
  };

  maplibregl.addProtocol("pmtiles", new pmtiles.Protocol().tile);
  const [w, so, e, n] = s.bbox;
  const map = new maplibregl.Map({
    container: "map",
    style: {
      version: 8,
      sources: {
        job: { type: "vector",
               url: `pmtiles://${location.origin}/jobs/${jobId}/output.pmtiles` }
      },
      layers: [
        { id: "bg", type: "background", paint: { "background-color": "#f8f8f6" } },
        { id: "fill", type: "fill", source: "job", "source-layer": "features",
          filter: ["==", ["geometry-type"], "Polygon"],
          paint: { "fill-color": ageColor, "fill-opacity": 0.85 } },
        { id: "outline", type: "line", source: "job", "source-layer": "features",
          filter: ["==", ["geometry-type"], "Polygon"], minzoom: 13,
          paint: { "line-color": "#fff", "line-width": 0.5, "line-opacity": 0.6 } },
        { id: "lines", type: "line", source: "job", "source-layer": "features",
          filter: ["==", ["geometry-type"], "LineString"],
          paint: { "line-color": ageColor, "line-width": 1.5 } },
        { id: "pts", type: "circle", source: "job", "source-layer": "features",
          filter: ["==", ["geometry-type"], "Point"],
          paint: { "circle-color": ageColor, "circle-radius": 3,
                   "circle-stroke-color": "#fff", "circle-stroke-width": 1 } }
      ]
    },
    bounds: [[w, so], [e, n]],
    fitBoundsOptions: { padding: 20 }
  });
  window.map = map;
  map.on("error", (ev) => {
    hud.insertAdjacentHTML("beforeend", "<br><b>map error:</b> ");
    hud.appendChild(  // message as text, may echo response bytes
      document.createTextNode(String(ev.error && ev.error.message)));
    console.error(ev.error);
  });
  map.once("idle", () => { window.__rendered = true; });
}

(jobId ? show() : index()).catch(e => { hud.textContent = "" + e; });
</script>
</body>
</html>
