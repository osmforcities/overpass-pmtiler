# Example nginx location -- the service has no auth by design, so the
# proxy IS the access control. Include inside an existing `server` block
# on the host (or a TLS-terminating vhost) and restrict to the consuming
# app's addresses.

location /pmtiler/ {
    # trusted clients only -- everything else never reaches the service
    allow 203.0.113.10;   # consuming app
    deny  all;

    proxy_pass http://127.0.0.1:8099/;
    proxy_http_version 1.1;

    # archives are tens of MB and pmtiles clients read them with Range
    # requests -- stream straight through, never buffer to disk
    proxy_buffering off;
    proxy_request_buffering off;

    # a POST is answered immediately (202), but a slow GET of a big
    # archive over a slow link needs headroom
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
