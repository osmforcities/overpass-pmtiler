<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PMTiles harness — SP buildings 2.1M</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
<style>
  html, body, #map { margin:0; height:100%; }
  #hud { position:fixed; top:8px; left:8px; z-index:10; background:#fff;
         font:12px monospace; padding:6px 10px; border:1px solid #ccc; }
</style>
</head>
<body>
<div id="map"></div>
<div id="hud">loading…</div>
<script>
const protocol = new pmtiles.Protocol();
maplibregl.addProtocol("pmtiles", protocol.tile);

// app recency bands (dataset-recency.ts) + viridis knobs (map-style.ts)
const now = Math.floor(Date.now() / 1000);
const d = 86400;
const ageColor = ["step", ["-", now, ["get", "_ts"]],
  "#414487",          // <= 90d: recent
  90 * d, "#2a788e",  // 90d-1y
  365 * d, "#22a884", // 1-2y
  730 * d, "#7ad151"  // > 2y
];

const map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: {
      sp: { type: "vector", url: "pmtiles://http://localhost:8765/sp-buildings.pmtiles" }
    },
    layers: [
      { id: "bg", type: "background", paint: { "background-color": "#f8f8f6" } },
      { id: "fill", type: "fill", source: "sp", "source-layer": "features",
        filter: ["==", ["geometry-type"], "Polygon"],
        paint: { "fill-color": ageColor, "fill-opacity": 0.85 } },
      { id: "outline", type: "line", source: "sp", "source-layer": "features",
        filter: ["==", ["geometry-type"], "Polygon"],
        minzoom: 13,
        paint: { "line-color": "#ffffff", "line-width": 0.5, "line-opacity": 0.6 } },
      { id: "lines", type: "line", source: "sp", "source-layer": "features",
        filter: ["==", ["geometry-type"], "LineString"],
        paint: { "line-color": ageColor, "line-width": 1.5 } },
      { id: "pts", type: "circle", source: "sp", "source-layer": "features",
        filter: ["==", ["geometry-type"], "Point"],
        paint: { "circle-color": ageColor, "circle-radius": 3,
                 "circle-stroke-color": "#fff", "circle-stroke-width": 1 } }
    ]
  },
  bounds: [[-46.8262692, -24.0079003], [-46.3650898, -23.3577551]],
  fitBoundsOptions: { padding: 20 }
});

window.map = map;
const hud = document.getElementById("hud");
const t0 = performance.now();
let tiles = 0, bytes = 0;
map.on("dataloading", () => {});
map.on("data", (e) => { if (e.tile) tiles++; });
map.once("idle", () => {
  const ms = Math.round(performance.now() - t0);
  hud.textContent = `first idle: ${ms} ms, tiles loaded: ${tiles}, zoom: ${map.getZoom().toFixed(1)}`;
  window.__harness = { firstIdleMs: ms, tiles };
});
map.on("moveend", () => {
  hud.textContent = `zoom ${map.getZoom().toFixed(1)} center ${map.getCenter().lng.toFixed(3)},${map.getCenter().lat.toFixed(3)} tiles ${tiles}`;
});
map.on("error", (e) => { hud.textContent = "ERROR: " + (e.error && e.error.message); console.error(e.error); });
</script>
</body>
</html>
